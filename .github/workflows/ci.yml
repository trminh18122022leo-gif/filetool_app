name: CI - Quality & Build Assurance

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. SECURITY & CODE INTEGRITY SCAN
  # --------------------------------------------------------------------------
  security-audit:
    name: Security & Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Leaked Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # --------------------------------------------------------------------------
  # 2. BACKEND VERIFICATION (Matrix Node 20.x & 22.x)
  # --------------------------------------------------------------------------
  backend-check:
    name: Backend Validation (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Verify Backend JavaScript Syntax
        run: npm test

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

  # --------------------------------------------------------------------------
  # 3. FRONTEND VERIFICATION (Vite Build + Bundle Check)
  # --------------------------------------------------------------------------
  frontend-check:
    name: Frontend Build Check (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Production Client
        run: |
          cd client
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 3

  # --------------------------------------------------------------------------
  # 4. DOCKERFILE INTEGRATION BUILD (Dry-Run Verification)
  # --------------------------------------------------------------------------
  docker-check:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: filetools-app:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
