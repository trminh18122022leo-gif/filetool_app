name: CD - Deploy to Production (Vercel & Render)

on:
  workflow_run:
    workflows: ["CI - Quality & Build Assurance"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target service'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - vercel
          - render
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: cd-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1. DEPLOY BACKEND TO RENDER
  # --------------------------------------------------------------------------
  deploy-render:
    name: Deploy Backend to Render
    # Only deploy if:
    # 1. Manually triggered with target 'all' or 'render'
    # 2. Automatically triggered via workflow_run AND CI succeeded
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'render')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Validate Render Deploy Hook Secret
        id: check-render-secret
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL is not configured in GitHub Secrets. Skipping Render deployment."
            echo "has_hook=false" >> $GITHUB_OUTPUT
          else
            echo "has_hook=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Render Deploy Hook
        if: steps.check-render-secret.outputs.has_hook == 'true'
        run: |
          echo "🚀 Sending trigger signal to Render Deploy Hook..."
          HTTP_RESPONSE=$(curl -s -w "HTTPSTATUS:%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e 's/HTTPSTATUS\:.*//g')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Render deployment has been successfully triggered!"
          else
            echo "❌ Render deployment hook failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # 2. DEPLOY FRONTEND TO VERCEL (Hardened: S-16 Resolved, Approval Gates & SHA Provenance)
  # --------------------------------------------------------------------------
  deploy-vercel-preview:
    name: Deploy Frontend (Vercel Preview)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.target == 'all' || github.event.inputs.target == 'vercel') &&
      github.event.inputs.environment == 'preview'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Build Production Client
        run: cd client && npm run build

      - name: Deploy to Vercel (Preview via Official CLI)
        run: |
          npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          PREVIEW_URL=$(npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "Preview deployment URL: $PREVIEW_URL"
        working-directory: ./client
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-vercel-production:
    name: Deploy Frontend (Vercel Production - Approval Gate)
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'vercel') && github.event.inputs.environment == 'production') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log Release Provenance
        run: |
          echo "================ RELEASE PROVENANCE ================"
          echo "Target Commit SHA : ${{ github.sha }}"
          echo "Target Git Ref    : ${{ github.ref }}"
          echo "Triggered By User : ${{ github.actor }}"
          echo "Workflow Run ID   : ${{ github.run_id }}"
          echo "Timestamp (UTC)   : $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "===================================================="

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Build Production Client
        run: cd client && npm run build

      - name: Deploy to Vercel (Production via Official CLI)
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          PROD_URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Production deployment URL: $PROD_URL"
        working-directory: ./client
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post-Deployment Smoke Verification
        run: |
          echo "🔎 Running post-deployment health check on production edge..."
          PROD_HOST="https://filetools-app.vercel.app"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_HOST" || echo "000")
          echo "Edge response HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 304 ]; then
            echo "✅ Smoke check passed: Production frontend is reachable."
          else
            echo "⚠️ Smoke check warning: Received HTTP $HTTP_STATUS from edge."
            echo "Refer to docs/ops/ROLLBACK_PLAN.md for immediate traffic rollback."
          fi
